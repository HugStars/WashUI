<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)" />
    <meta name="description"
        content="WashUI 是一个 Vue 3 设计系统，包含设计变量、组件、布局、主题、Toast、路由与组合式函数，并提供完整的交互文档与示例。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WashUI 文档" />
    <meta property="og:description" content="Vue 3 设计系统与文档站：组件、布局、主题、路由与工具函数。" />
    <meta property="og:image" content="/favicon.svg" />
    <link rel="icon" href="/favicon.svg" />
    <title>WashUI 文档</title>
    <script>
        try {
            var saved = localStorage.getItem('wa_theme')
            var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
            document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) { }
    </script>
</head>

<body>
    <script type="module" src="/main.js"></script>
</body>

</html>
