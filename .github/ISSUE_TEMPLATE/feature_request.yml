name: ✨ 功能建议
description: 新组件、新能力或现有 API 的改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先搜索已有 issue 和路线图，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前遇到的限制，而不是直接给出实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 希望组件、参数或事件长什么样，可以附 API 草案。
      placeholder: |
        <AppXxx v-model="value" :options="options" />
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 现在是怎么绕过的，或考虑过哪些其他做法。
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
    validations:
      required: false
